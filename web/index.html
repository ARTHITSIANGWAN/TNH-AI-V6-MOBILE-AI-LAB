<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThitNueaHub | Mobile AI Lab</title>
    <style>
        :root {
            --primary-blue: #58a6ff;
            --bg-dark: #0d1117;
            --card-bg: #161b22;
        }
        body {
            background: radial-gradient(circle at center, #1a1c2c 0%, var(--bg-dark) 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            background: rgba(22, 27, 34, 0.8);
            border: 1px solid #30363d;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .logo-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
        }
        .logo {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--primary-blue);
            box-shadow: 0 0 30px rgba(88, 166, 255, 0.4);
            animation: pulse 3s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(88, 166, 255, 0.4); }
            50% { transform: scale(1.02); box-shadow: 0 0 40px rgba(88, 166, 255, 0.6); }
            100% { transform: scale(1); box-shadow: 0 0 20px rgba(88, 166, 255, 0.4); }
        }
        h1 {
            font-size: 2.2rem;
            margin: 10px 0;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(to right, #fff, var(--primary-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .status-badge {
            display: inline-block;
            padding: 5px 15px;
            background: rgba(63, 185, 80, 0.1);
            color: #3fb950;
            border: 1px solid #3fb950;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 15px;
        }
        p { color: #8b949e; font-size: 1rem; line-height: 1.6; }
        .footer-text {
            margin-top: 25px;
            font-size: 0.8rem;
            color: #484f58;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="status-badge">● SYSTEM ONLINE</div>
        <div class="logo-wrapper">
            <img src="7873.jpg" alt="ThitNueaHub White Tiger" class="logo">
        </div>
        <h1>ThitNueaHub</h1>
        <p>"พายุไม่ได้มาเพื่อทำลาย... แต่มาเพื่อประกาศศักดาความยิ่งใหญ่"</p>
        <div class="footer-text">Powered by Gemini & Google Cloud Run</div>
    </div>
</body>
</html>
