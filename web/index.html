<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐅 ThitNueaHub Cockpit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; font-family: sans-serif; }
        .glass-panel { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="text-white flex items-center justify-center min-h-screen p-4">

    <div class="glass-panel rounded-3xl p-6 w-full max-w-sm shadow-2xl">
        
        <div class="mb-6 text-center">
            <h1 class="text-2xl font-bold tracking-tighter text-blue-400">🐅 ThitNueaHub</h1>
            <p class="text-[10px] text-gray-500 mt-1 uppercase tracking-widest">Mobile AI Lab • V.7 Ignite</p>
        </div>

        <div class="mb-6 bg-black/20 p-4 rounded-2xl border border-white/5">
            <div class="flex justify-between items-center mb-4">
                <span class="text-[10px] font-bold text-blue-400 tracking-widest">BASIC WORKFLOW</span>
                <span id="live-indicator" class="flex items-center text-[9px] text-green-400">
                    <span class="w-1.5 h-1.5 rounded-full bg-green-500 mr-1.5 animate-pulse"></span> ONLINE
                </span>
            </div>

            <div class="space-y-4">
                <div id="step-1" class="transition-all duration-500">
                    <div class="flex justify-between text-[10px] mb-1.5">
                        <span class="text-gray-400">1. DATA RECEIVE</span>
                        <span id="percent-1" class="text-blue-400">0%</span>
                    </div>
                    <div class="h-1 w-full bg-white/5 rounded-full overflow-hidden">
                        <div id="bar-1" class="h-full bg-blue-500 w-0 transition-all duration-700 ease-out"></div>
                    </div>
                </div>

                <div id="step-2" class="opacity-40 transition-all duration-500">
                    <div class="flex justify-between text-[10px] mb-1.5">
                        <span class="text-gray-400">2. CORE PROCESSING</span>
                        <span id="percent-2" class="text-purple-400">0%</span>
                    </div>
                    <div class="h-1 w-full bg-white/5 rounded-full overflow-hidden">
                        <div id="bar-2" class="h-full bg-purple-500 w-0 transition-all duration-700 ease-out"></div>
                    </div>
                </div>
            </div>

            <div class="mt-4 pt-3 border-t border-white/5">
                <p class="text-[9px] text-gray-600 italic text-center">
                    🔒 อัปเกรดเพื่อปลดล็อก AI วิเคราะห์พฤติกรรมลูกค้า
                </p>
            </div>
        </div>

        <div class="space-y-3">
            <button onclick="fireAPI('/api/ignite')" class="w-full bg-blue-600 hover:bg-blue-500 active:scale-95 py-4 rounded-xl font-bold text-sm transition-all shadow-lg shadow-blue-900/20 flex items-center justify-center">
                🚀 1-CLICK IGNITE
            </button>
            <button onclick="fireAPI('/api/surgery')" class="w-full bg-white/5 hover:bg-white/10 active:scale-95 py-3 rounded-xl font-bold text-xs border border-white/10 transition-all flex items-center justify-center">
                🛠️ SURGERY MODE
            </button>
        </div>

        <div class="mt-6">
            <div id="terminal" class="bg-black/40 rounded-xl p-3 h-20 overflow-y-auto text-[10px] font-mono text-blue-300 border border-white/5">
                > System ready. Waiting for command...
            </div>
        </div>
    </div>

    <script>
        const CLOUD_RUN_URL = "https://thitnueahub-mobile-ai-lab-968501187230.asia-southeast1.run.app";

        function logToTerminal(msg) {
            const t = document.getElementById('terminal');
            t.innerHTML += `<br>> ${msg}`;
            t.scrollTop = t.scrollHeight;
        }

        async function fireAPI(endpoint) {
            logToTerminal(`Executing ${endpoint}...`);
            
            // Reset Progress
            document.getElementById('bar-1').style.width = '0%';
            document.getElementById('bar-2').style.width = '0%';
            document.getElementById('percent-1').innerText = '0%';
            document.getElementById('percent-2').innerText = '0%';

            try {
                // Step 1 Simulation
                document.getElementById('bar-1').style.width = '100%';
                document.getElementById('percent-1').innerText = '100%';
                document.getElementById('step-2').classList.remove('opacity-40');

                const response = await fetch(CLOUD_RUN_URL + endpoint, { method: 'POST', mode: 'no-cors' });

                // Step 2 Simulation (ให้ดูว่าประมวลผลแป๊บเดียวจบ)
                setTimeout(() => {
                    document.getElementById('bar-2').style.width = '100%';
                    document.getElementById('percent-2').innerText = '100%';
                    logToTerminal(`✅ Mission Completed.`);
                }, 600);

            } catch (err) {
                logToTerminal(`❌ Error: ${err.message}`);
            }
        }
    </script>
</body>
</html>
