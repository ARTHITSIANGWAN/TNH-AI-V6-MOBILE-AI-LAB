<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThitNueaHub | Mobile AI Lab</title>
    <style>
        body { background-color: #05070a; color: #fff; font-family: system-ui, sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        .main-card { padding: 20px; animation: fadeIn 1.2s ease-out; }
        .tiger-frame { width: 250px; height: 250px; border-radius: 50%; overflow: hidden; border: 2px solid #58a6ff; box-shadow: 0 0 40px rgba(88,166,255,0.3); margin: 0 auto 20px; }
        .tiger-frame img { width: 100%; height: 100%; object-fit: cover; }
        h1 { font-size: 2.2rem; letter-spacing: 4px; margin: 0; background: linear-gradient(to right, #fff, #58a6ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .status-bar { background: rgba(88,166,255,0.1); border: 1px solid rgba(88,166,255,0.3); border-radius: 50px; padding: 8px 20px; font-size: 0.75rem; display: inline-flex; align-items: center; margin: 20px 0; }
        .status-dot { width: 8px; height: 8px; background: #00ffc3; border-radius: 50%; margin-right: 10px; box-shadow: 0 0 10px #00ffc3; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="main-card">
        <div class="tiger-frame"><img src="image_0.png" alt="Tiger"></div>
        <h1>ThitNueaHub</h1>
        <div class="status-bar"><div class="status-dot"></div>SYSTEM ONLINE: DARK-RELAY V3.5</div>
        <p style="color:#8b949e; font-style:italic;">"พายุไม่ได้มาเพื่อทำลาย... แต่มาเพื่อประกาศศักดา"</p>
    </div>
</body>
</html>
