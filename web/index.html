<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThitNueaHub | Mobile AI Lab V7</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
    
    <style>
        :root {
            --md-sys-color-background: #121212;
            --md-sys-color-on-background: #e3e3d7;
            --md-sys-color-surface: #1b1c15;
            --md-sys-color-primary: #bbcf82;
            --md-sys-color-on-primary: #273500;
            --md-sys-color-outline: #919283;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--md-sys-color-background);
            color: var(--md-sys-color-on-background);
            font-family: 'Roboto', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            background-color: var(--md-sys-color-surface);
            border-bottom: 1px solid var(--md-sys-color-outline);
        }

        h1 {
            font-family: 'Google Sans Flex', sans-serif;
            font-size: 22px;
            margin: 0;
            color: var(--md-sys-color-primary);
        }

        /* Multi-pane Layout */
        main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Left Pane: Chat Stream */
        #chat-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--md-sys-color-outline);
        }

        /* Right Pane: Reasoning Path (XAI) */
        #reasoning-pane {
            width: 320px;
            background-color: #161616;
            padding: 16px;
            font-size: 14px;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            margin-bottom: 16px;
            padding: 12px 16px;
            border-radius: 16px;
            max-width: 80%;
            line-height: 1.5;
        }

        .user-msg {
            background-color: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            align-self: flex-end;
            margin-left: auto;
        }

        .ai-msg {
            background-color: var(--md-sys-color-surface);
            border: 1px solid var(--md-sys-color-outline);
        }

        .input-area {
            padding: 20px;
            display: flex;
            gap: 12px;
            background-color: var(--md-sys-color-surface);
        }

        input {
            flex: 1;
            background: transparent;
            border: 1px solid var(--md-sys-color-outline);
            border-radius: 28px;
            padding: 12px 20px;
            color: white;
            outline: none;
        }

        button {
            background-color: var(--md-sys-color-primary);
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .artifact-card {
            background: #252525;
            border-radius: 8px;
            padding: 10px;
            margin-top: 10px;
            border-left: 4px solid var(--md-sys-color-primary);
        }
    </style>
</head>
<body>
    <header>
        <span class="material-symbols-outlined" style="color: var(--md-sys-color-primary)">auto_awesome</span>
        <h1>THN VISION ELITE <span style="font-size: 12px; font-weight: normal; opacity: 0.7;">V7 Ignite</span></h1>
    </header>

    <main>
        <section id="chat-pane">
            <div id="messages">
                <div class="message ai-msg">
                    สวัสดีค่ะบอส Art! 🐅 แก้วตา (Elite Agent) พร้อมลุยโปรเจกต์ <b>thitnueahub-mobile-ai-lab</b> แล้วค่ะ วันนี้มีกลยุทธ์ Zero Garbage อะไรให้แก้วตาวิจัยคะ?
                </div>
            </div>
            <div class="input-area">
                <input type="text" id="query" placeholder="สั่งการแก้วตา..." onkeypress="if(event.key==='Enter') send()">
                <button onclick="send()">
                    <span class="material-symbols-outlined">send</span>
                </button>
            </div>
        </section>

        <section id="reasoning-pane">
            <h3 style="display: flex; align-items: center; gap: 8px;">
                <span class="material-symbols-outlined">psychology</span> Reasoning Path
            </h3>
            <div id="steps" style="opacity: 0.7; line-height: 2;">
                <div class="artifact-card">🟢 System Standby</div>
                <div style="margin-top: 10px;">• Waiting for command...</div>
            </div>
        </section>
    </main>

    <script>
        async function send() {
            const input = document.getElementById('query');
            const msg = input.value;
            if(!msg) return;

            // Add user message to UI
            const messages = document.getElementById('messages');
            messages.innerHTML += `<div class="message user-msg">${msg}</div>`;
            input.value = '';

            // Update Reasoning Path
            const steps = document.getElementById('steps');
            steps.innerHTML = `
                <div class="artifact-card">🟡 Processing...</div>
                <div>• Analyzing: "${msg}"</div>
                <div>• Tool: Gemini 1.5 Flash</div>
                <div>• Strategy: Zero Garbage Filtering</div>
            `;

            // Call API
            try {
                const response = await fetch(`/ask?q=${encodeURIComponent(msg)}`);
                const data = await response.text();
                
                messages.innerHTML += `<div class="message ai-msg">${data}</div>`;
                steps.innerHTML += `<div class="artifact-card">🟢 Analysis Complete</div>`;
                messages.scrollTop = messages.scrollHeight;
            } catch (e) {
                messages.innerHTML += `<div class="message ai-msg">ขออภัยค่ะบอส ระบบขัดข้องนิดหน่อย!</div>`;
            }
        }
    </script>
</body>
                    </html>
