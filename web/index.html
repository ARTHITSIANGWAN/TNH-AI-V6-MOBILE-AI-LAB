<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThitNueaHub | Mobile AI Lab</title>
    <style>
        body {
            background-color: #05070a;
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }
        .main-card {
            padding: 20px;
            animation: fadeIn 1.5s ease-in-out;
        }
        .tiger-frame {
            width: 280px;
            height: 280px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #fff;
            box-shadow: 0 0 50px rgba(88, 166, 255, 0.4);
            margin: 0 auto 20px;
        }
        .tiger-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h1 {
            font-size: 2.5rem;
            letter-spacing: 5px;
            margin: 0;
            text-transform: uppercase;
            background: linear-gradient(to right, #ffffff, #58a6ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            color: #58a6ff;
            font-weight: bold;
            letter-spacing: 2px;
            margin-top: 10px;
        }
        .quote {
            color: #8b949e;
            font-style: italic;
            margin-top: 30px;
            font-size: 0.9rem;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="main-card">
        <div class="tiger-frame">
            <img src="image_0.png" alt="ThitNueaHub Majestic Tiger">
        </div>
        <h1>ThitNueaHub</h1>
        <div class="subtitle">MOBILE AI LAB</div>
        <p class="quote">"พายุไม่ได้มาเพื่อทำลาย... แต่มาเพื่อประกาศศักดา"</p>
    </div>
</body>
</html>
