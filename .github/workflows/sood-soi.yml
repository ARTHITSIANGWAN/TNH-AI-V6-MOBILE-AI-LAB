name: 🚀 TNH_AI_SOOD_SOI_UNIFIER
on:
  workflow_dispatch: # ปุ่มกด Ignite ด้วยมือจอมทัพบนหน้าจอโทรศัพท์

jobs:
  push_to_empire:
    runs-on: ubuntu-latest
    steps:
      - name: 🛡️ Step 1: Checkout Source (5S Audit - สะสาง)
        uses: actions/checkout@v4

      - name: 📦 Step 2: Pack Everything (TS/TOML/JSON - คุมน้ำหนักตัวเบา)
        run: |
          mkdir -p bundle
          # [ทางน้ำไหลสะดวก] กวาดโค้ดทั้งหมดไปรวมศูนย์ แต่แอบคัดไฟล์วิดีโอ (.mp4) และรูป (.jpg) 
          # ออกจากท่อโยกย้ายชั่วคราว เพื่อไม่ให้ไฟล์มีเดียหนักๆ วิ่งไปทับถมจนฐานข้อมูลโปรเจกต์ 13 อืด 
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='*.mp4' \
            --exclude='*.jpg' \
            ./ bundle/

      - name: 🚚 Step 3: Ignite to Project 13 (Monolith Target)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
        run: |
          git config --global user.name "TNH-AI-JOD-L5"
          git config --global user.email "jod@tnh.ai"
          
          echo "⏳ [0.32ms]: เปิดสะพานล่องหน ดึงมหาจักรวรรดิโปรเจกต์ 13 ลงมา..."
          git clone https://x-access-token:${GH_TOKEN}@github.com/ARTHITSIANGWAN/TNH-AI-9th-Era-of-Fire-AI-Orchestra-Mastering-Go-Engine- destination
          
          # แยกสัดส่วนโฟลเดอร์อัตโนมัติ ตามรอยตราประทับของคลังแสงต้นทาง
          TARGET_DIR="destination/from_$(basename $GITHUB_REPOSITORY)"
          mkdir -p $TARGET_DIR
          
          echo "🚚 [Transfer]: โยกย้ายไฟล์รหัสบริสุทธิ์เข้าสู่พื้นที่พอร์ตเดี่ยว :2026..."
          cp -rv bundle/* $TARGET_DIR/
          
          cd destination
          git add .
          
          # ดักจับสถานะ หากโค้ดไม่มีการเคลื่อนไหวให้ปล่อยผ่านทันที ท่อไม่ระเบิดแน่นอนบอส!
          git commit -m "L5: [สุดซอยสายหลบหลีก] ย้ายกองกำลังจาก $(basename $GITHUB_REPOSITORY) เข้าคลังกลางพร้อมเปิดสถานะสดแล้วก้า! 🤫" || echo "No changes"
          
          echo "⚡ [Ignite]: ดันซอร์สโค้ดทะลุกำแพงเข้าโปรเจกต์ 13 สำเร็จ!"
          git push
          
