name: Deploy Mobile AI Lab to Cloud Run
on:
  push:
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: google-github-actions/auth@v1
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy thn-mobile-ai-lab \
            --source . \
            --region asia-southeast1 \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "LINE_CHANNEL_SECRET=${{ secrets.LINE_SECRET }},LINE_CHANNEL_ACCESS_TOKEN=${{ secrets.LINE_TOKEN }},GOOGLE_CLOUD_PROJECT=${{ secrets.GCP_PROJECT_ID }},DISCORD_WEBHOOK_URL=${{ secrets.DISCORD_URL }}"
            
