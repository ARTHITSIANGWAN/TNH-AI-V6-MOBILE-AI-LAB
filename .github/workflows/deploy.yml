name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # บอสต้องตั้งค่า GCP_CREDENTIALS ใน GitHub Secrets ด้วยนะ (ถ้าเคยทำไว้แล้วก็ผ่านฉลุย)
      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy thitnueahub-mobile-ai-lab \
            --source . \
            --project project-6e34f0b2-4c9d-4422-865 \
            --region asia-southeast1 \
            --allow-unauthenticated
            
